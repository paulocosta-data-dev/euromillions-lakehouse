version: 2

models:

  - name: silver_draws

    description: >
      Canonical EuroMillions analytical dataset derived from
      raw Iceberg bronze ingestion.

    columns:

      - name: draw_id

        description: >
          Synthetic unique identifier assigned during ingestion.

        tests:
          - not_null
          - unique

      - name: draw_date

        description: >
          Official EuroMillions draw date.

        tests:
          - not_null
          - unique

      - name: jackpot_amount

        description: >
          Jackpot amount for the corresponding draw in EUR.

        tests:
          - not_null

      - name: jackpot_currency

        description: >
          Currency associated with jackpot amounts.

        tests:
          - not_null

      - name: draw_year

        description: >
          Calendar year extracted from draw date.

      - name: draw_month

        description: >
          Calendar month extracted from draw date.